name: Build TWRP for Hi Nova 9 Pro (Hebe)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "twrp-11.0", "twrp-12.1" ]

env:
  DEVICE_NAME: Hebe
  DEVICE_PATH: device/hinova/Hebe
  LUNCH_NAME: omni_Hebe-eng
  MANIFEST_URL: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git
  MANIFEST_BRANCH: twrp-11.0

jobs:
  build:
    name: Build TWRP Recovery
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: device/hinova/Hebe

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

      - name: Setup Build Environment
        run: |
          sudo apt update
          sudo apt install -y gperf gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev \
            x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip \
            fontconfig libncurses5 curl python3 python-is-python3 repo

      - name: Setup Git Credentials
        run: |
          git config --global user.name "Builder"
          git config --global user.email "builder@github.com"

      - name: Initialize Repo
        run: |
          mkdir ~/twrp_tree && cd ~/twrp_tree
          repo init -u ${{ env.MANIFEST_URL }} -b ${{ env.MANIFEST_BRANCH }} --depth=1
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Move Device Tree to Build Tree
        run: |
          mkdir -p ~/twrp_tree/${{ env.DEVICE_PATH }}
          cp -r ${{ github.workspace }}/${{ env.DEVICE_PATH }}/* ~/twrp_tree/${{ env.DEVICE_PATH }}/

      - name: Build TWRP
        run: |
          cd ~/twrp_tree
          source build/envsetup.sh
          lunch ${{ env.LUNCH_NAME }}
          mka recoveryimage

      - name: Split and Pack Huawei recovery_ramdisk
        run: |
          cd ~/twrp_tree
          mkdir -p out/huawei_out
          cp ${{ env.DEVICE_PATH }}/pack_recovery_ramdisk.py out/huawei_out/
          python3 -c "
          with open('out/target/product/Hebe/recovery.img', 'rb') as f:
              data = f.read()
          import struct
          magic, ksz, rdsz = struct.unpack('<8sII', data[:16])
          k_pad = (ksz + 4095) // 4096 * 4096
          rd_data = data[4096 + k_pad : 4096 + k_pad + rdsz]
          with open('out/huawei_out/ramdisk.cpio.gz', 'wb') as rf:
              rf.write(rd_data)
          print('Extracted ramdisk:', len(rd_data), 'bytes')
          "
          python3 out/huawei_out/pack_recovery_ramdisk.py out/huawei_out/ramdisk.cpio.gz out/huawei_out/recovery_ramdisk_hebe_twrp.img

      - name: Upload Recovery Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-Hebe
          path: |
            ~/twrp_tree/out/target/product/Hebe/recovery.img
            ~/twrp_tree/out/huawei_out/recovery_ramdisk_hebe_twrp.img
