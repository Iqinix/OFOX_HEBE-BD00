name: Build TWRP for Hi Nova 9 Pro (Hebe)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "twrp-11", "twrp-12.1" ]

env:
  DEVICE_NAME: Hebe
  DEVICE_PATH: device/hinova/Hebe
  LUNCH_NAME: twrp_Hebe-eng
  MANIFEST_URL: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
  MANIFEST_BRANCH: twrp-11

jobs:
  build:
    name: Build TWRP Recovery
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: device/hinova/Hebe

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

      - name: Setup Build Environment
        run: |
          sudo apt update
          sudo apt install -y gperf gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev \
            x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip \
            fontconfig libncurses5 curl python3 python-is-python3 git schedtool
          mkdir -p ~/.bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+x ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

      - name: Setup Git Credentials
        run: |
          git config --global user.name "Builder"
          git config --global user.email "builder@github.com"

      - name: Initialize Repo
        run: |
          export PATH=$HOME/.bin:$PATH
          mkdir ~/twrp_tree && cd ~/twrp_tree
          repo init -u ${{ env.MANIFEST_URL }} -b ${{ env.MANIFEST_BRANCH }} --depth=1
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Move Device Tree to Build Tree
        run: |
          mkdir -p ~/twrp_tree/${{ env.DEVICE_PATH }}
          cp -r ${{ github.workspace }}/${{ env.DEVICE_PATH }}/* ~/twrp_tree/${{ env.DEVICE_PATH }}/
          ls -la ~/twrp_tree/${{ env.DEVICE_PATH }}

      - name: Build TWRP
        run: |
          cd ~/twrp_tree
          set +e
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch ${{ env.LUNCH_NAME }}
          set -e
          mka recoveryimage || make -j$(nproc --all) recoveryimage

      - name: Split and Pack Huawei recovery_ramdisk
        run: |
          cd ~/twrp_tree
          mkdir -p out/huawei_out
          cp ${{ env.DEVICE_PATH }}/pack_recovery_ramdisk.py out/huawei_out/
          python3 -c "
          import os, struct, gzip
          rec_path = 'out/target/product/Hebe/recovery.img'
          rd_candidates = [
              'out/target/product/Hebe/ramdisk-recovery.img',
              'out/target/product/Hebe/ramdisk-recovery.cpio.gz',
              'out/target/product/Hebe/ramdisk-recovery.cpio',
          ]
          rd_data = None
          for c in rd_candidates:
              if os.path.exists(c):
                  with open(c, 'rb') as f:
                      rd_data = f.read()
                  print(f'Found standalone ramdisk candidate {c}: {len(rd_data)} bytes')
                  break
          if rd_data is None and os.path.exists(rec_path):
              with open(rec_path, 'rb') as f:
                  data = f.read()
              magic, ksz, rdsz = struct.unpack('<8sII', data[:16])
              print(f'recovery.img: magic={magic}, ksz={ksz}, rdsz={rdsz}')
              hdr_ver = struct.unpack('<I', data[40:44])[0] if len(data) > 44 else 0
              if hdr_ver >= 3:
                  page_size = 4096
              else:
                  page_size = struct.unpack('<I', data[36:40])[0]
              k_pad = (ksz + page_size - 1) // page_size * page_size
              rd_data = data[page_size + k_pad : page_size + k_pad + rdsz]
              print(f'Extracted ramdisk from recovery.img: {len(rd_data)} bytes')
          if rd_data is None:
              raise RuntimeError('Could not find recovery.img or ramdisk!')
          if rd_data[:2] != b'\x1f\x8b':
              print('Compressing raw cpio ramdisk with gzip...')
              rd_data = gzip.compress(rd_data)
          with open('out/huawei_out/ramdisk.cpio.gz', 'wb') as rf:
              rf.write(rd_data)
          print('Prepared ramdisk.cpio.gz:', len(rd_data), 'bytes')
          "
          python3 out/huawei_out/pack_recovery_ramdisk.py out/huawei_out/ramdisk.cpio.gz out/huawei_out/recovery_ramdisk_hebe_twrp.img

      - name: Upload Recovery Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-Hebe
          path: |
            ~/twrp_tree/out/target/product/Hebe/recovery.img
            ~/twrp_tree/out/huawei_out/recovery_ramdisk_hebe_twrp.img
