name: Build OrangeFox Recovery for Hi Nova 9 Pro (Hebe)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "fox_11.0", "fox_12.1" ]

env:
  DEVICE_NAME: Hebe
  DEVICE_PATH: device/hinova/Hebe
  LUNCH_NAME: fox_Hebe-eng

jobs:
  build:
    name: Build OrangeFox Recovery
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: device/hinova/Hebe

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

      - name: Setup Build Environment
        run: |
          sudo apt update
          sudo apt install -y gperf gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev \
            x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip \
            fontconfig libncurses5 curl python3 python-is-python3 git
          mkdir -p ~/.bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+x ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

      - name: Setup Git Credentials
        run: |
          git config --global user.name "Builder"
          git config --global user.email "builder@github.com"

      - name: Sync OrangeFox Source
        run: |
          export PATH=$HOME/.bin:$PATH
          git clone https://gitlab.com/OrangeFox/sync.git ~/OrangeFox_sync
          cd ~/OrangeFox_sync
          ./orangefox_sync.sh --branch 11.0 --path ~/fox_tree

      - name: Move Device Tree to Build Tree
        run: |
          mkdir -p ~/fox_tree/${{ env.DEVICE_PATH }}
          cp -r ${{ github.workspace }}/${{ env.DEVICE_PATH }}/* ~/fox_tree/${{ env.DEVICE_PATH }}/

      - name: Build OrangeFox
        run: |
          cd ~/fox_tree
          source build/envsetup.sh
          lunch ${{ env.LUNCH_NAME }}
          mka recoveryimage

      - name: Split and Pack Huawei recovery_ramdisk
        run: |
          cd ~/fox_tree
          mkdir -p out/huawei_out
          cp ${{ env.DEVICE_PATH }}/pack_recovery_ramdisk.py out/huawei_out/
          python3 -c "
          with open('out/target/product/Hebe/recovery.img', 'rb') as f:
              data = f.read()
          import struct
          magic, ksz, rdsz = struct.unpack('<8sII', data[:16])
          k_pad = (ksz + 4095) // 4096 * 4096
          rd_data = data[4096 + k_pad : 4096 + k_pad + rdsz]
          with open('out/huawei_out/ramdisk.cpio.gz', 'wb') as rf:
              rf.write(rd_data)
          print('Extracted ramdisk:', len(rd_data), 'bytes')
          "
          python3 out/huawei_out/pack_recovery_ramdisk.py out/huawei_out/ramdisk.cpio.gz out/huawei_out/recovery_ramdisk_hebe_ofox.img

      - name: Upload Recovery Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-Hebe
          path: |
            ~/fox_tree/out/target/product/Hebe/recovery.img
            ~/fox_tree/out/huawei_out/recovery_ramdisk_hebe_ofox.img
            ~/fox_tree/out/target/product/Hebe/OrangeFox*.zip
